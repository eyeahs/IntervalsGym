name: Android OAuth Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        env:
          INTERVALS_OAUTH_CLIENT_ID: ${{ secrets.INTERVALS_OAUTH_CLIENT_ID }}
          INTERVALS_OAUTH_CLIENT_SECRET: ${{ secrets.INTERVALS_OAUTH_CLIENT_SECRET }}
        run: |
          ./gradlew clean assembleDebug testDebugUnitTest \
            -Pintervalsgym.oauth.intervals.clientId="$INTERVALS_OAUTH_CLIENT_ID" \
            -Pintervalsgym.oauth.intervals.clientSecret="$INTERVALS_OAUTH_CLIENT_SECRET" \
            -Pintervalsgym.oauth.intervals.redirectScheme=intervalsgym \
            -Pintervalsgym.oauth.intervals.redirectHost=intervals-oauth

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IntervalsGym-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
